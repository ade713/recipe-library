name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-checks:
    name: Tests, Ruff, and mypy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests -q

      - name: Run Ruff
        run: |
          python -m ruff check \
            app/api/router.py \
            app/api/routes/health.py \
            app/api/routes/ingredients.py \
            app/schemas \
            app/services/scaling.py \
            app/services/url_validator.py \
            tests

      - name: Run mypy
        run: |
          python -m mypy \
            app/api/routes/ingredients.py \
            app/schemas \
            app/services/scaling.py \
            app/services/url_validator.py
